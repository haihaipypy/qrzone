# qrzone — 二维码管理平台
# 单 Worker 架构：前端静态资源与后端 API 由同一个 Worker 托管，同源部署，无需配置跨域与后端地址。
#
# KV 命名空间故意不写 id：首次部署时 Wrangler 会自动创建并写回 id，
# 因此 fork 本项目后不需要手动去 Cloudflare 后台建 KV。
# 参考 https://developers.cloudflare.com/workers/wrangler/configuration/#automatic-provisioning

name = "qrzone"
main = "./src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：Next.js 静态导出产物（frontend/out）
# run_worker_first 必须显式声明 /api/* 与 /q/*：
# 扫码访问短链属于 navigation request，若不声明，Cloudflare 会优先返回 index.html，
# 导致短链跳转与 API 请求全部失效。
[assets]
directory = "./frontend/out"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*", "/q/*"]

# 首次部署时自动创建，id 会写回本文件
[[kv_namespaces]]
binding = "QR_KV"

[[kv_namespaces]]
binding = "AUTH_KV"
